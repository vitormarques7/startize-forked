<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Círculo de fundo verde -->
  <circle cx="50" cy="50" r="45" fill="url(#greenGrad)"/>

  <!-- Corpo do foguete -->
  <path d="M 45 65 L 45 35 Q 45 25 50 20 Q 55 25 55 35 L 55 65 Z"
        fill="url(#rocketGrad)"
        stroke="#e0e0e0"
        stroke-width="1"/>

  <!-- Janela do foguete -->
  <circle cx="50" cy="40" r="5" fill="#10b981" opacity="0.6"/>

  <!-- Asa esquerda -->
  <path d="M 45 55 L 35 70 L 45 65 Z"
        fill="#f0f0f0"
        stroke="#d0d0d0"
        stroke-width="1"/>

  <!-- Asa direita -->
  <path d="M 55 55 L 65 70 L 55 65 Z"
        fill="#f0f0f0"
        stroke="#d0d0d0"
        stroke-width="1"/>

  <!-- Chamas do foguete (3 camadas) -->
  <path d="M 45 65 L 42 75 L 45 72 Z"
        fill="#fbbf24"
        opacity="0.9"/>
  <path d="M 50 65 L 50 78 L 50 72 Z"
        fill="#f59e0b"
        opacity="0.9"/>
  <path d="M 55 65 L 58 75 L 55 72 Z"
        fill="#fbbf24"
        opacity="0.9"/>

  <!-- Detalhes de brilho -->
  <circle cx="38" cy="32" r="6" fill="white" opacity="0.25"/>
  <ellipse cx="52" cy="28" rx="3" ry="5" fill="white" opacity="0.15"/>
</svg>
